<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <title>Iron Man Gemini Live</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #182538, #070b12 48%); color: #f6f8fb; }
    main { width: min(100%, 34rem); min-height: 100vh; margin: auto; padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom)); display: grid; align-content: center; gap: 1rem; }
    .arc { width: 5.4rem; height: 5.4rem; margin: 0 auto .4rem; border-radius: 50%; background: #bff7ff; box-shadow: 0 0 2rem #40d9ff, inset 0 0 0 .55rem #2a6685; }
    h1, p { margin: 0; text-align: center; }
    h1 { font-size: 2rem; letter-spacing: .02em; }
    .subtitle { color: #aeb9c9; line-height: 1.45; }
    .card { padding: 1rem; border: 1px solid #26364d; border-radius: 1rem; background: rgba(11, 18, 29, .88); }
    label { display: block; margin-bottom: .45rem; color: #c8d2df; font-size: .9rem; }
    input { width: 100%; padding: .85rem; border: 1px solid #344761; border-radius: .75rem; background: #0a101a; color: white; font-size: 1rem; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: .85rem; }
    button { min-height: 3.2rem; border: 0; border-radius: .8rem; font-size: 1rem; font-weight: 700; }
    #start { background: #4edcff; color: #051019; }
    #stop { background: #26364d; color: white; }
    button:disabled { opacity: .45; }
    #status { min-height: 1.5rem; color: #80e8ff; text-align: center; }
    #transcript { min-height: 4.8rem; padding: .8rem; border-radius: .75rem; background: #070b12; color: #dce6f3; line-height: 1.45; white-space: pre-wrap; }
    .privacy { color: #7f8da1; font-size: .78rem; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <div class="arc" aria-hidden="true"></div>
    <h1>Iron Man</h1>
    <p class="subtitle">Gemini Live hears you. Iron Man handles the work.</p>
    <section class="card">
      <label for="token">Private Iron Man token (optional when auth is disabled)</label>
      <input id="token" type="password" autocomplete="off" placeholder="Paste once on this iPhone">
      <div class="buttons">
        <button id="start" type="button">Start voice</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
    </section>
    <p id="status" role="status">Ready</p>
    <section id="transcript" aria-live="polite">Tap Start voice, then speak naturally.</section>
    <p class="privacy">Audio is streamed to Vertex AI Gemini Live. Requests are handed to the private Iron Man backend. Each session is capped by the server.</p>
  </main>
  <script>
    const tokenInput = document.querySelector("#token");
    const startButton = document.querySelector("#start");
    const stopButton = document.querySelector("#stop");
    const status = document.querySelector("#status");
    const transcript = document.querySelector("#transcript");
    const tokenStorageKey = "ironman_recovery_token";
    let socket, stream, audioContext, processor, source;
    let playbackTime = 0;
    tokenInput.value = localStorage.getItem(tokenStorageKey) || "";
    function setStatus(message) { status.textContent = message; }
    function pcm16(float32) {
      const out = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) out[i] = Math.max(-1, Math.min(1, float32[i])) * 0x7fff;
      return out.buffer;
    }
    function downsample(float32, fromRate, toRate) {
      if (fromRate === toRate) return float32;
      const ratio = fromRate / toRate, length = Math.round(float32.length / ratio), out = new Float32Array(length);
      for (let i = 0; i < length; i++) {
        const start = Math.floor(i * ratio), end = Math.min(Math.floor((i + 1) * ratio), float32.length);
        let sum = 0; for (let j = start; j < end; j++) sum += float32[j];
        out[i] = sum / Math.max(1, end - start);
      }
      return out;
    }
    function playAudio(encoded) {
      if (!audioContext) return;
      const raw = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
      const pcm = new Int16Array(raw.buffer), samples = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) samples[i] = pcm[i] / 0x7fff;
      const buffer = audioContext.createBuffer(1, samples.length, 24000);
      buffer.copyToChannel(samples, 0);
      const node = audioContext.createBufferSource(); node.buffer = buffer; node.connect(audioContext.destination);
      playbackTime = Math.max(playbackTime, audioContext.currentTime);
      node.start(playbackTime); playbackTime += buffer.duration;
    }
    function handleMessage(event) {
      const message = JSON.parse(event.data);
      if (message.type === "audio") playAudio(message.data);
      if (message.type === "input_transcript") transcript.textContent = `You: ${message.text}`;
      if (message.type === "output_transcript" || message.type === "text" || message.type === "tool_result") transcript.textContent = message.text || message.reply || transcript.textContent;
      if (message.type === "ready") setStatus("Listening");
      if (message.type === "turn_complete") setStatus("Listening");
      if (message.type === "limit") { setStatus("Session limit reached"); stopVoice(); }
      if (message.type === "error") { transcript.textContent = message.error; setStatus("Voice error"); }
    }
    async function startVoice() {
      localStorage.setItem(tokenStorageKey, tokenInput.value.trim());
      startButton.disabled = true; tokenInput.disabled = true; setStatus("Connecting…");
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
        audioContext = new AudioContext(); await audioContext.resume(); source = audioContext.createMediaStreamSource(stream);
        const scheme = location.protocol === "https:" ? "wss" : "ws";
        socket = new WebSocket(`${scheme}://${location.host}/realtime/live`); socket.binaryType = "arraybuffer";
        socket.onopen = () => {
          socket.send(JSON.stringify({ type: "auth", token: tokenInput.value.trim(), session_id: "iphone-realtime" }));
          processor = audioContext.createScriptProcessor(4096, 1, 1);
          processor.onaudioprocess = e => { if (socket?.readyState === WebSocket.OPEN) socket.send(pcm16(downsample(e.inputBuffer.getChannelData(0), audioContext.sampleRate, 16000))); };
          source.connect(processor); processor.connect(audioContext.destination); stopButton.disabled = false;
        };
        socket.onmessage = handleMessage; socket.onclose = () => { if (startButton.disabled) stopVoice(); }; socket.onerror = () => setStatus("Voice connection failed");
      } catch (error) { transcript.textContent = error.message; setStatus("Could not start voice"); stopVoice(); }
    }
    function stopVoice() {
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: "stop" }));
      socket?.close(); processor?.disconnect(); source?.disconnect(); stream?.getTracks().forEach(t => t.stop()); audioContext?.close();
      socket = processor = source = stream = audioContext = undefined; playbackTime = 0; startButton.disabled = false; stopButton.disabled = true; tokenInput.disabled = false;
      if (status.textContent !== "Could not start voice") setStatus("Stopped");
    }
    startButton.addEventListener("click", startVoice); stopButton.addEventListener("click", stopVoice); window.addEventListener("pagehide", stopVoice);
  </script>
</body>
</html>
